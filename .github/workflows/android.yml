name: APK Android (Petits Pas)

on:
  push:
    paths:
      - "petits-pas/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petits-pas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petits-pas/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'app web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: petits-pas/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/petits-pas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: petits-pas-apk
          path: petits-pas/android/app/build/outputs/apk/debug/petits-pas.apk
