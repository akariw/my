<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Tâches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Mes Tâches</h1>

    <form id="form" class="add">
      <input id="input" type="text" placeholder="Ajouter une tâche…" autocomplete="off" maxlength="200" required>
      <button type="submit">Ajouter</button>
    </form>

    <nav class="filters" aria-label="Filtres">
      <button data-filter="all" class="active">Toutes</button>
      <button data-filter="active">À faire</button>
      <button data-filter="done">Terminées</button>
    </nav>

    <ul id="list" class="list"></ul>

    <footer class="footer">
      <span id="count"></span>
      <button id="clear" class="link">Effacer les terminées</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
